# formalization.yaml (v0.2): repo-root metadata for formalization projects.
# One family-level descriptor, placed identically in the root of all six libraries.
# [required] fields should be filled; everything else is optional.

version: "v0.2"

# project - the formalization itself (not the source).
project:
  name: "flt-vandiver (six-library family)"   # [required]
  authors:                        # [required] who did the formalization
    - "Bradley Arthur Taylor"
  license: "Apache-2.0"           # [required]
  # the six sibling libraries this descriptor covers (clone as siblings; release tag afm-v1):
  repositories:
    - name: "flt-vandiver"              # engine: Case I/II descent, Washington Thm 9.5, certificate bridges
    - name: "flt-vandiver-primes"       # native_decide instances: every prime 17<=p<1000, plus 16843 and 2124679
    - name: "flt-vandiver-primes-kernel" # kernel decide (zero compiler trust): the 8 irregular primes <200
    - name: "flt-regular-extended"      # kernel Bernoulli => regular FLT, 17<=q<350 (47 primes)
    - name: "flt-cyclotomic-nt"         # Herbrand, cyclotomic unit index, class-group Stickelberger, cert base
    - name: "flt-stickelberger"         # clean-room Gauss-sum / Stickelberger core (Mathlib-only)

# sources - what was formalized. List of papers/textbooks/blueprints.
sources:                          # [required] list of sources
  - title: "Introduction to Cyclotomic Fields"
    authors:
      - "Lawrence C. Washington"
    id: "2nd ed., Graduate Texts in Mathematics 83, Springer, 1997 (esp. Ch. 6 and Thm 9.5)"
    type: "textbook"
    license: ""
    author_contacted: "n/a"
    prior_work: "builds on the flt-regular project (Best, Birkbeck, Brasca, Rodriguez Boidi, Van de Velde, Yang)"

# how it was produced
automation:
  method: "agent"                 # [required] manual | copilot | mixed | agent | autonomous
  models:                         # code authored ~100% by Claude
    - "claude-opus-4.8"           # ~95% of the code
    - "claude-opus-4.7"
    - "claude-opus-5.0"
  models_consulted:               # second opinions only; no code written
    - "grok-4.3"
    - "grok-4.5"
    - "gemini-3.1-pro"
  framework: "Claude Code with Lean LSP tooling"
  cost:
    wall_time: "~2 months (late May to late July 2026)"
    spend_usd: "~$500 Anthropic; consultations ~$400 Grok + ~$400 Gemini; +~$600 GCP c4d-standard-64 rental for the p = 2124679 certificate build"
    hardware: "Lenovo ThinkPad P16s Gen 4 (AMD); GCP c4d-standard-64 for the 2124679 certificate only"
  notes: >
    All Lean proof text was written by Claude (principally Opus 4.8) under the author's
    mathematical direction: the author chose the targets and the Washington-9.5 route, supplied and
    checked the per-prime certificate data, and accepted or rejected model output. Grok and Gemini
    were consulted for second opinions, not for code. Sub-1000 and Wolstenholme instances (in
    flt-vandiver-primes) are discharged by native_decide; the kernel libraries
    (flt-vandiver-primes-kernel, flt-regular-extended) and the Mathlib-only cores
    (flt-stickelberger, flt-cyclotomic-nt) carry no compiler-trust axiom. Main results are verified
    with comparator.

# project status
status:
  scope: >
    A Lean 4 formalization of the classical (Kummer-Vandiver) cyclotomic route to Fermat's Last
    Theorem beyond the regular case: Mathlib's FermatLastTheoremFor is proved for every prime
    17 <= p < 1000 and for both known Wolstenholme primes 16843 and 2124679, weakening the
    regularity hypothesis of prior formalizations to Vandiver's condition p does not divide h^+.
  sorry_count: 0
  sorry_in_definitions: 0
  # Axiom note (verified via #print axioms): native_decide generates one DISTINCT, named axiom per
  # certificate, of the form <declaration>._native.native_decide.ax_* -- not a shared Lean.ofReduceBool.
  # So #print axioms reports the three standard axioms plus one per certificate: 2 for a typical
  # sub-1000 prime, 5 at 16843 (4 Q_i slices + SG), 65 at 2124679 (64 slices + SG). These appear only
  # in flt-vandiver-primes; every other library uses the three standard axioms alone.
  axioms:                         # standard base shared by the whole family
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    # + per-certificate native_decide axioms in flt-vandiver-primes (see note above and main_results)
  main_results:                   # representatives spanning the axiom stories
    - declaration: "FltVandiver.fermatLastTheoremFor_2124679"
      repository: "flt-vandiver-primes"
      file: "FltPrimes/FLT2124679.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      native_decide_certificates: 65   # 64 Q_i slices + SG; each a distinct ..._native.native_decide.ax_* axiom
    - declaration: "FltVandiver.fermatLastTheoremFor_16843"
      repository: "flt-vandiver-primes"
      file: "FltPrimes/FLT16843.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      native_decide_certificates: 5    # 4 Q_i slices + SG
    - declaration: "FLT37.fermatLastTheoremFor_37"
      repository: "flt-vandiver-primes-kernel"
      file: "FLT37.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]   # zero compiler trust
    - declaration: "FltOfBernoulli.fermatLastTheoremFor_of_bernoulli"
      repository: "flt-regular-extended"
      file: "FltOfBernoulli.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "CyclotomicNT.stickelberger_annihilates"
      repository: "flt-cyclotomic-nt"
      file: "CyclotomicNT/Stickelberger.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

# fidelity
fidelity:
  divergences: ""

# review status
review:
  status: "author-verified"       # [required]
  reviewers:
    - "Bradley Arthur Taylor"
  notes: ""

# alignment - how source statements map to formal declarations.
alignment:
  paper: "Lean 4 Formalization of Fermat's Last Theorem for Every Prime Exponent Below 1000, Regular and Irregular, and Two Wolstenholme Primes (2026)"
  blueprint: ""                   # planned
