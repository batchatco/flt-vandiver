name = "«flt-vandiver»"
defaultTargets = ["FltVandiver"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.style.header = false

[[require]]
name = "«flt-regular»"
git = "https://github.com/leanprover-community/flt-regular.git"
rev = "215d1c49d1f163e83a30e89a709202146b808638"

[[require]]
name = "«flt-stickelberger»"
path = "../flt-stickelberger"

[[require]]
name = "«flt-cyclotomic-nt»"
path = "../flt-cyclotomic-nt"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "CertKernel"
globs = ["CertKernel"]
precompileModules = true

[[lean_lib]]
name = "FltVandiver"
globs = ["FltVandiver"]
